<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO Meta Tags -->
  <title>Raj Kumar - Full-Stack Software Engineer | Futuristic Portfolio</title>
  <meta name="description"
    content="Explore the futuristic portfolio of Raj Kumar, a senior full-stack software engineer specializing in React, Three.js, AI Integration, and cutting-edge web technologies." />
  <meta name="keywords"
    content="Full-Stack Developer, Software Engineer, React, Three.js, AI, Web Development, Portfolio" />
  <meta name="author" content="Raj Kumar" />

  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Raj Kumar - Full-Stack Software Engineer" />
  <meta property="og:description" content="Crafting futuristic digital experiences with cutting-edge technology" />
  <meta property="og:type" content="website" />

  <!-- Performance Optimization -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Prevent zoom on mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <style>
    /* Critical CSS for loading screen */
    #root {
      width: 100%;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000000;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    /* Prevent text selection during interactions */
    * {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
