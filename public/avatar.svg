<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="200" height="200" fill="#0a0a0a" />
  <circle cx="100" cy="100" r="90" stroke="url(#grad1)" stroke-width="4" fill="none" filter="url(#glow)" />
  
  <path d="M100,50 C70,50 50,80 50,110 C50,140 70,180 100,180 C130,180 150,140 150,100 C150,70 130,50 100,50 Z" fill="url(#grad1)" opacity="0.8" />
  <circle cx="100" cy="80" r="30" fill="#000" />
  
  <line x1="50" y1="100" x2="150" y2="100" stroke="#00f0ff" stroke-width="2" opacity="0.5" />
  <line x1="100" y1="50" x2="100" y2="150" stroke="#00f0ff" stroke-width="2" opacity="0.5" />
</svg>
